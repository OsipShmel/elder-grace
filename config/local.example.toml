# Copy to config/local.toml (it is in .gitignore) and adjust the paths.

[paths]
# Shared local data: prefixes, caches, captures, traces. Never in git.
local_dir = "/path/to/ProjectPort/.local"

# One section per game; the key is the game id (`grace-<id>` is its repository).
[games.eldenring]
# Pristine install from your store. Read-only, never modified.
pristine_dir = "/path/to/ELDEN RING/Game"
# Working copy for the oracle and the shims. Your own files may go here.
sandbox_dir  = "/path/to/ProjectPort/.local/game_bean/elden_ring"
# Prepared cache for the native runtime.
cache_dir    = "/path/to/ProjectPort/.local/cache/eldenring"
exe          = "eldenring.exe"
steam_appid  = 1245620
window_title = "ELDEN RING"

[oracle]
# Oracle environment: "gptk" (cargo xtask oracle) or "crossover"
env    = "gptk"
bottle = "EldenRing"
